# tag 推送（v*）触发双平台构建 → 测试 → 打包 → GitHub Release
# 日常 push 走 ci.yml 上传 Artifact，不必打 tag 也能下载 exe
# Windows 钉 windows-2022 + VS2022（windows-latest 已是 VS18，不再保证 Win7 导入面）
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # release job 需要 GITHUB_TOKEN 写 Release

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version stamp
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            ver="${GITHUB_REF_NAME#v}"
          else
            ver=$(sed -n 's/.*kToolVersion = "\([^"]*\)".*/\1/p' core/model.hpp | head -1)
            ver="${ver}-${GITHUB_SHA:0:7}"
          fi
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "version=$ver"

      - name: Build & test（Alpine builder 容器，与本地 build-linux.sh 同镜像）
        run: |
          docker build -f docker/builder.Dockerfile -t ctfir-builder:ci .
          mkdir -p out-linux
          docker run --rm -v "$PWD":/src:ro -v "$PWD/out-linux":/out ctfir-builder:ci sh -c '
            cmake -S /src -B /tmp/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_CXX_FLAGS="-static" -DCMAKE_EXE_LINKER_FLAGS="-static" > /tmp/cfg.log &&
            cmake --build /tmp/build &&
            /tmp/build/ctfir_tests &&
            echo ==LINUX_CI_BUILD_OK== &&
            cp /tmp/build/ctfir /tmp/build/ctfir_tests /out/ &&
            (ldd /out/ctfir 2>&1 || true) | head -1'

      - name: Stage package
        run: bash scripts/package-ci.sh --platform linux-x86_64 --ver "${{ steps.meta.outputs.ver }}" --out staging --bin out-linux/ctfir

      - name: Zip
        run: |
          (cd staging && zip -qr "../ctfir-v${{ steps.meta.outputs.ver }}-linux-x86_64.zip" .)
          sha256sum "ctfir-v${{ steps.meta.outputs.ver }}-linux-x86_64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-zip
          path: ctfir-v*-linux-x86_64.zip
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: "2022"

      - name: Toolchain stamp
        shell: bash
        run: |
          echo "VisualStudioVersion=${VisualStudioVersion:-unset}"
          echo "VCToolsVersion=${VCToolsVersion:-unset}"
          where cl

      - name: Version stamp
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            ver="${GITHUB_REF_NAME#v}"
          else
            ver=$(sed -n 's/.*kToolVersion = "\([^"]*\)".*/\1/p' core/model.hpp | head -1)
            ver="${ver}-${GITHUB_SHA:0:7}"
          fi
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "version=$ver"

      - name: Build（Ninja + msvc-dev-cmd；/MT 与 WINVER 由 CMakeLists 定义）
        shell: bash
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Unit tests
        shell: bash
        run: ./build/ctfir_tests.exe

      - name: Verify 零依赖（dumpbin 依赖面）
        shell: bash
        run: |
          dumpbin //dependents build/ctfir.exe | head -30

      - name: Stage package
        shell: bash
        run: bash scripts/package-ci.sh --platform windows-x64 --ver "${{ steps.meta.outputs.ver }}" --out staging --bin build/ctfir.exe build/ctfir-gui.exe

      - name: Zip（Python zipfile UTF-8；不用 tar -a / Compress-Archive）
        shell: bash
        run: python scripts/zip-utf8.py --root staging --out "ctfir-v${{ steps.meta.outputs.ver }}-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: ctfir-v*-windows-x64.zip
          if-no-files-found: error

  release:
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: rel

      - name: 根级 SHA256SUMS
        run: (cd rel && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rel/*.zip
            rel/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## 比赛携行版（断网可用）

            - **Windows**：解压即用 `ctfir.exe`（CLI）/ `ctfir-gui.exe`（GUI）——静态 /MT 编译，零运行时依赖，无管理员权限也可跑（受限模块如实标 PERMISSION_DENIED）
            - **Linux**：解压后 `chmod +x ctfir`——musl 静态二进制
            - **15 分钟应急流程**：`ctfir doctor` → `ctfir scan --out out` → `ctfir actions --session out --bucket clear`（复制命令，不执行）→ 人工粘贴 → `ctfir diff`
            - GUI **没有**修复按钮，也不做 360/SFC/DISM 一键系统修复
            - 完整说明见包内 `README-先读我.md` / `KNOWN_LIMITATIONS.md`；校验见 `SHA256SUMS.txt`
