# ctfir 发布 CI：tag 推送（v*）触发双平台构建 → 测试 → 打包 → GitHub Release
# 工具链与本地完全同源：
#   Linux  = 仓库自带 docker/builder.Dockerfile（alpine:3.20 + g++/musl-dev 静态编译）
#   Windows = windows-latest MSVC（/MT 静态 CRT + WINVER=0x0601 已在 CMakeLists 定义）
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write   # release job 需要 GITHUB_TOKEN 写 Release

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build & test（Alpine builder 容器，与本地 build-linux.sh 同镜像）
        run: |
          docker build -f docker/builder.Dockerfile -t ctfir-builder:ci .
          mkdir -p out-linux
          docker run --rm -v "$PWD":/src:ro -v "$PWD/out-linux":/out ctfir-builder:ci sh -c '
            cmake -S /src -B /tmp/build -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_CXX_FLAGS="-static" -DCMAKE_EXE_LINKER_FLAGS="-static" > /tmp/cfg.log &&
            cmake --build /tmp/build &&
            /tmp/build/ctfir_tests &&
            echo ==LINUX_CI_BUILD_OK== &&
            cp /tmp/build/ctfir /tmp/build/ctfir_tests /out/ &&
            (ldd /out/ctfir 2>&1 || true) | head -1'

      - name: Stage package
        run: bash scripts/package-ci.sh --platform linux-x86_64 --ver "${GITHUB_REF_NAME#v}" --out staging --bin out-linux/ctfir

      - name: Zip
        run: |
          (cd staging && zip -qr "../ctfir-v${GITHUB_REF_NAME#v}-linux-x86_64.zip" .)
          sha256sum "ctfir-v${GITHUB_REF_NAME#v}-linux-x86_64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-zip
          path: ctfir-v*-linux-x86_64.zip
          if-no-files-found: error

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Build（Ninja + msvc-dev-cmd；/MT 与 WINVER 由 CMakeLists 定义）
        shell: bash
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build

      - name: Unit tests
        shell: bash
        run: ./build/ctfir_tests.exe

      - name: Verify 零依赖（dumpbin 依赖面）
        shell: bash
        run: |
          dumpbin //dependents build/ctfir.exe | head -30

      - name: Stage package
        shell: bash
        run: bash scripts/package-ci.sh --platform windows-x64 --ver "${GITHUB_REF_NAME#v}" --out staging --bin build/ctfir.exe build/ctfir-gui.exe

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path staging/* -DestinationPath "ctfir-v${{ github.ref_name }}-windows-x64.zip" -Force

      - uses: actions/upload-artifact@v4
        with:
          name: windows-zip
          path: ctfir-v*-windows-x64.zip
          if-no-files-found: error

  release:
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: rel

      - name: 根级 SHA256SUMS
        run: (cd rel && sha256sum *.zip > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rel/*.zip
            rel/SHA256SUMS.txt
          generate_release_notes: true
